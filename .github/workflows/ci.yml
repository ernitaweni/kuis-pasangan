# Gerbang kualitas di GitHub: jalan di setiap push ke main dan setiap pull request.
# Vercel tetap men-deploy setiap push. Lindungi branch main (docs/05-deployment.md §4.2) agar
# hanya kode yang lolos CI yang masuk ke produksi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, unit test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Node 24 (npm 11), sama dengan laptop pengembang. npm 10 (Node 22) menolak lockfile buatan
      # npm 11 ("Missing: @emnapi/core ... from lock file"), dan Firebase SDK 13 butuh Node 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run coverage
      - run: npm run build

  rules:
    name: Integration test (Security Rules di emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Firebase Emulator butuh Java 21.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:integration
