# Gerbang kualitas di GitHub: jalan di setiap push ke main dan setiap pull request.
# Vercel tetap men-deploy setiap push. Lindungi branch main (docs/05-deployment.md §5) agar hanya
# kode yang lolos CI yang masuk ke produksi.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, format, unit test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run coverage
      - run: npm run build

  rules:
    name: Integration test (Security Rules di emulator)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Firebase Emulator butuh Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:integration
